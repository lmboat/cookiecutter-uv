repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
        exclude: ^({{cookiecutter.project_name}}/\.devcontainer/devcontainer\.json|\.devcontainer/devcontainer\.json|{{cookiecutter.project_name}}/)$
      - id: pretty-format-json
        exclude: ^({{cookiecutter.project_name}}/\.devcontainer/devcontainer\.json|\.devcontainer/devcontainer\.json|{{cookiecutter.project_name}}/)$
        args: [--autofix, --no-sort-keys]
      - id: check-toml
        exclude: ^{{cookiecutter.project_name}}/
      - id: check-yaml
        exclude: ^{{cookiecutter.project_name}}/
      # Secret hygiene runs on the template directory too: a key committed there
      # would ship in every generated project.
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=5000]

  - repo: https://github.com/gitleaks/gitleaks
    rev: "v8.30.1"
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.7"
    hooks:
      - id: ruff-check
        args: [--exit-non-zero-on-fix, --config=pyproject.toml]
        exclude: ^{{cookiecutter.project_name}}
      - id: ruff-format
        args: [--config=pyproject.toml]
        exclude: ^{{cookiecutter.project_name}}
